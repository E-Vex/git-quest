[package]
name = "git-quest"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "The missing CLI for GitHub Achievements — track your progress and hunt good first issues."
license = "MIT"
repository = "https://github.com/E-Vex/git-quest"
homepage = "https://github.com/E-Vex/git-quest"
readme = "README.md"
keywords = ["github", "achievements", "cli", "developer-tools", "open-source"]
categories = ["command-line-utilities"]
authors = ["E-Vex <raiedaleve@gmail.com>"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
owo-colors = "4.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
wiremock = "0.6.5"
